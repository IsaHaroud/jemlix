<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151823">
<title>Jemlix — Admin login</title>
<link rel="icon" href="/jemlix-mark.png" type="image/png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login">
<main class="login-box">
  <a class="wordmark" href="/" aria-label="Jemlix"><img class="brand-logo" src="/jemlix-logo.png" alt=""></a>
  <p class="muted">Admin area — enter your access code</p>
  <form id="login">
    <label class="sr" for="admin-token">Access code</label>
    <input id="admin-token" name="token" type="password" placeholder="Access code" autocomplete="current-password" required autofocus>
    <button type="submit" class="primary">Log in</button>
  </form>
  <p id="error" class="form-error" hidden></p>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
