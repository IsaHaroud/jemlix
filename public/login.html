<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151823">
<title>Jemla — Admin login</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login">
<main class="login-box">
  <a class="wordmark" href="/">Jemla</a>
  <p class="muted">Admin area — enter your access code</p>
  <form id="login">
    <input name="token" type="password" placeholder="Access code" autocomplete="current-password" autofocus>
    <button type="submit" class="primary">Log in</button>
  </form>
  <p id="error" class="form-error" hidden></p>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
